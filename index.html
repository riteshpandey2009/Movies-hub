<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Hub</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-zinc-900 text-white selection:bg-red-500 selection:text-white">
    <header class=" fixed inset-x-0 border-b-2  border-zinc-500/10">
        <div class="flex max-w-6xl mx-auto justify-between px-6 py-4 bg-black z-10">

            <div class="flex gap-4 items-center">
                <svg class="w-7 h-7 text-red-600" fill="currentColor" viewBox="0 0 24 24">
                    <path
                        d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2zm0 2v3h2.5l1.5-3H4zm4.5 0l-1.5 3h3l1.5-3H8.5zm5 0l-1.5 3h3l1.5-3h-3zm5 0l-1.5 3H20V6h-1.5zM4 11v7h16v-7H4z" />
                </svg>

                <h1 class="text-red-500">Movie Hub</h1>
            </div>

            <div id="hamburger">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16" />
                </svg>

            </div>


        </div>
        <div id="option" class="hidden">
            <a href="">Home</a>
            <a href=""></a>
            <a href=""></a>
            <a href=""></a>
        </div>
    </header>

    <main class=" pt-20 max-w-4xl mx-auto">
        <div>
            <form class="mx-auto" action="" id="movie-form">
                <input id="movie-input" type="text" placeholder="Search Movie title (e.g. Inception , The Matrix)....">
                <button>Search</button>
            </form>
        </div>

        <div id="movieHub"></div>
    </main>
    <footer>
        <p class="text-sm"> &copy; 2026 Ritesh Pandey. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>

</html>
